services:
  # 🌍 WGS84 / CGCS2000 坐标转换服务（群晖可视化部署推荐）
  coordinate-converter:
    # 镜像版本：可先用 latest；如需固定可改成 2.0.2
    image: ghcr.io/marod1m/wgs84-cgcs2000:${APP_VERSION:-latest}

    # 端口映射：左边是群晖/宿主机端口，右边 5000 不要改
    # 示例：想用 12345 访问就写 "12345:5000"
    ports:
      - "${APP_PORT:-5000}:5000"

    # 在线地图预览（仅天地图）
    environment:
      # tianditu | none
      MAP_PROVIDER: ${MAP_PROVIDER:-tianditu}
      # 天地图浏览器端 Key；也可留空后在页面“地图设置”中填写
      # 请在天地图控制台配置实际访问域名/IP 白名单
      TIANDITU_KEY: ${TIANDITU_KEY:-}

    # 容器异常退出时自动重启（家用/轻量生产推荐）
    restart: unless-stopped
