name: docker-build-and-publish

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q tests

  docker:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wgs84-cgcs2000
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          outputs: type=registry,oci-mediatypes=false
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Verify published image compatibility
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/wgs84-cgcs2000:${tag}"
          manifest=$(docker buildx imagetools inspect "${image}" --format '{{json .Manifest}}')
          media=$(printf '%s' "${manifest}" | jq -r '.mediaType')
          echo "Published manifest media type: ${media}"
          test "${media}" = "application/vnd.docker.distribution.manifest.list.v2+json"
          if printf '%s' "${manifest}" | jq -e '.manifests[] | select(.platform.architecture == "unknown")' >/dev/null; then
            echo "Unexpected unknown/unknown manifest entries" >&2
            exit 1
          fi
          docker pull "${image}"
          docker run --rm "${image}" python -c "import main, sys; sys.exit(0 if main.APP_VERSION == '${tag}' else 1)"
          echo "Verified image version and Docker manifest list compatibility"

      - name: Remove broken legacy image versions
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: wgs84-cgcs2000
          CURRENT_TAG: ${{ steps.meta.outputs.version }}
          LEGACY_TAGS: 2.0.0 2.0.1 2.0.2
        run: |
          set -euo pipefail
          gh api --paginate "/users/${OWNER}/packages/container/${PACKAGE}/versions" --jq '.[]' |
          jq -r --arg legacy "${LEGACY_TAGS}" --arg current "${CURRENT_TAG}" '
            (.metadata.container.tags // []) as $tags
            | ($legacy | split(" ") | map(select(length > 0))) as $old
            | select(($tags | length) > 0)
            | select(any($tags[]; . as $t | $old | index($t)))
            | select(any($tags[]; . == $current) | not)
            | .id' |
          while read -r id; do
            [ -n "${id}" ] || continue
            echo "Deleting broken legacy GHCR version ${id}"
            gh api -X DELETE "/users/${OWNER}/packages/container/${PACKAGE}/versions/${id}"
          done
